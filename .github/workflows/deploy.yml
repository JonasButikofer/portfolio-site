name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # TEMPORARY: print the identity GitHub presents to AWS, and the length
      # of the role ARN secret (should be 67). Remove once deploys work.
      - name: Debug OIDC identity
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          echo "role ARN secret length: ${#ROLE_ARN} (expected 67)"
          python3 - <<'PY'
          import os, json, base64, urllib.request
          req = urllib.request.Request(
              os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'] + '&audience=sts.amazonaws.com',
              headers={'Authorization': 'bearer ' + os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN']})
          tok = json.load(urllib.request.urlopen(req))['value']
          part = tok.split('.')[1]
          part += '=' * (-len(part) % 4)
          claims = json.loads(base64.urlsafe_b64decode(part))
          print({k: claims.get(k) for k in ('sub', 'aud', 'repository', 'ref', 'iss')})
          PY

      # No long-lived AWS keys — trust is scoped to this repo's main branch
      # only (see infra/oidc.tf).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Two passes, per SPEC.md §7.2-7.3: hashed assets get a long-lived
      # immutable cache; everything else (index.html) gets no-cache so a
      # deploy is visible immediately.
      - name: Sync hashed assets (immutable cache)
        run: |
          aws s3 sync dist/assets "s3://${{ vars.S3_BUCKET }}/assets" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync remaining files (no-cache, prune deleted)
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

      # Hashed assets never need invalidating; only the entry point does.
      - name: Invalidate CloudFront (index.html only)
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/index.html" "/"
